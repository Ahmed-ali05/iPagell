name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm run install:ci
      - name: Verify dependency patches
        run: npm run check:dependency-security
      - name: Audit dependencies
        run: npm audit --audit-level=low
      - run: npm run release:prepare
      - name: Auth compatibility on synthetic local D1
        run: npm run test:auth-d1
      - name: Export and restore synthetic local D1
        run: npm run test:auth-restore
      - name: Summary
        run: |
          echo 'Checks and build passed. This workflow does not deploy; to publish to https://ipagell.website follow docs/DEPLOYMENT.md.' >> "$GITHUB_STEP_SUMMARY"
