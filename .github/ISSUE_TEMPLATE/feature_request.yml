name: Feature request
description: Suggest an improvement or a new feature.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What is hard or impossible today, and who does it affect?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should happen instead? Mockups and examples are welcome.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Out of scope and alternatives
      description: What this request does not cover, and alternatives you considered.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This request does not require sharing grades or absences with other people by default.
