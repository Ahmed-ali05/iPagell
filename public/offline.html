<!doctype html>
<html lang="it">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f2f4f9">
<title>iPagell · Offline</title>
<style>html,body{height:100%;margin:0}body{display:grid;place-items:center;background:#f2f4f9;color:#171a2a;font:16px -apple-system,BlinkMacSystemFont,system-ui,sans-serif}.card{text-align:center;padding:28px}.icon{width:68px;height:68px;margin:auto;border-radius:20px;background:#6655e6;color:#fff;display:grid;place-items:center;font-size:23px;font-weight:800;box-shadow:0 15px 35px #6655e64a}h1{font-size:24px;margin:20px 0 8px}p{color:#6f7387;max-width:300px;line-height:1.5}a{color:#5140cb;font-weight:700}</style>
<div class="card"><div class="icon">iP</div><h1 data-copy="offline.title">Sei offline</h1><p><span data-copy="offline.description">Se hai già aperto iPagell su questo dispositivo, puoi riaprire l’app e consultare l’ultima copia salvata.</span> <a href="/app" data-copy="offline.openApp">Apri iPagell</a></p></div>
<script id="offline-copy" type="application/json">__OFFLINE_COPY__</script>
<script>
  try {
    const copy = JSON.parse(document.getElementById("offline-copy").textContent || "{}");
    const routeLocale = location.pathname.split("/")[1];
    const storedLocale = localStorage.getItem("ipagell-interface-locale-v1");
    const locale = Object.hasOwn(copy, routeLocale) ? routeLocale : (Object.hasOwn(copy, storedLocale) ? storedLocale : "it");
    document.documentElement.lang = locale;
    for (const element of document.querySelectorAll("[data-copy]")) {
      element.textContent = copy[locale][element.dataset.copy] || element.textContent;
    }
  } catch {}
</script>
</html>
